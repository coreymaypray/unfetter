<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRCA Products - The Real Cut Above Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Oswald:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #B22222;
            --dark-red: #8B0000;
            --gold: #D4AF37;
            --black: #000000;
            --white: #FFFFFF;
            --gray: #333333;
            --light-gray: #666666;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--black);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Header */
        .header {
            background-color: var(--black);
            padding: 15px 30px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gray);
        }

        .logo {
            font-family: 'Great Vibes', cursive;
            font-size: 28px;
            color: var(--white);
        }

        .logo span {
            color: var(--primary-red);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-red);
        }

        .cart-btn {
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
        }

        .cart-btn svg {
            fill: var(--white);
            transition: fill 0.3s;
        }

        .cart-btn:hover svg {
            fill: var(--primary-red);
        }

        .cart-count {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--primary-red);
            color: white;
            font-size: 10px;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 0.3s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Hero Banner */
        .shop-hero {
            padding: 140px 20px 60px;
            text-align: center;
            background: linear-gradient(135deg, var(--black) 0%, #1a0a0a 100%);
        }

        .shop-hero h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 48px;
            color: var(--primary-red);
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        .shop-hero p {
            font-size: 18px;
            color: var(--light-gray);
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px 20px;
            background: var(--gray);
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 30px;
            background: transparent;
            border: 2px solid var(--white);
            color: var(--white);
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover,
        .tab-btn.active {
            background: var(--primary-red);
            border-color: var(--primary-red);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(178, 34, 34, 0.4);
        }

        /* Products Grid */
        .products-section {
            padding: 60px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Product Card - The Magic Happens Here */
        .product-card {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid transparent;
        }

        .product-card:hover {
            transform: translateY(-15px) scale(1.03);
            border-color: var(--primary-red);
            box-shadow:
                0 20px 40px rgba(178, 34, 34, 0.3),
                0 0 30px rgba(178, 34, 34, 0.2);
        }

        .product-image {
            position: relative;
            height: 280px;
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .product-card:hover .product-image::before {
            left: 100%;
        }

        .product-icon {
            font-size: 80px;
            transition: transform 0.4s ease;
        }

        .product-card:hover .product-icon {
            transform: scale(1.2) rotate(5deg);
        }

        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--gold);
            color: var(--black);
            padding: 5px 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 3px;
            transform: translateX(-150%);
            transition: transform 0.3s ease 0.1s;
        }

        .product-card:hover .product-badge {
            transform: translateX(0);
        }

        .quick-view-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 12px 25px;
            font-family: 'Oswald', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .product-card:hover .quick-view-btn {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .quick-view-btn:hover {
            background: var(--dark-red);
            transform: translateX(-50%) scale(1.05);
        }

        .product-info {
            padding: 25px;
            text-align: center;
        }

        .product-name {
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
            color: var(--white);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .product-description {
            font-size: 13px;
            color: var(--light-gray);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .product-price {
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            color: var(--primary-red);
            margin-bottom: 15px;
        }

        .product-price .original {
            font-size: 16px;
            color: var(--light-gray);
            text-decoration: line-through;
            margin-right: 10px;
        }

        .add-to-cart-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--primary-red);
            color: var(--primary-red);
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .add-to-cart-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--primary-red);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .add-to-cart-btn:hover {
            color: var(--white);
        }

        .add-to-cart-btn:hover::before {
            left: 0;
        }

        .add-to-cart-btn.added {
            background: #228B22;
            border-color: #228B22;
            color: white;
        }

        /* Product Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border-radius: 20px;
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            transform: scale(0.8) translateY(50px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid var(--primary-red);
            box-shadow: 0 30px 60px rgba(178, 34, 34, 0.4);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-image {
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        .modal-image .product-icon {
            font-size: 150px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .modal-details {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--primary-red);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        .modal-close:hover {
            transform: rotate(90deg) scale(1.1);
            background: var(--dark-red);
        }

        .modal-title {
            font-family: 'Oswald', sans-serif;
            font-size: 32px;
            color: var(--white);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .modal-description {
            color: var(--light-gray);
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .modal-features {
            list-style: none;
            margin-bottom: 25px;
        }

        .modal-features li {
            padding: 8px 0;
            color: var(--light-gray);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-features li::before {
            content: '✓';
            color: var(--primary-red);
            font-weight: bold;
        }

        .modal-price {
            font-family: 'Oswald', sans-serif;
            font-size: 36px;
            color: var(--primary-red);
            margin-bottom: 20px;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .quantity-selector label {
            font-size: 14px;
            color: var(--light-gray);
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            border: 1px solid var(--gray);
        }

        .quantity-controls button {
            background: var(--gray);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .quantity-controls button:hover {
            background: var(--primary-red);
        }

        .quantity-controls input {
            width: 60px;
            height: 40px;
            text-align: center;
            border: none;
            background: var(--black);
            color: white;
            font-size: 16px;
        }

        .modal-add-btn {
            padding: 18px 40px;
            background: var(--primary-red);
            border: none;
            color: white;
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-add-btn:hover {
            background: var(--dark-red);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(178, 34, 34, 0.4);
        }

        /* Cart Sidebar */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background: linear-gradient(180deg, #1a1a1a, #0d0d0d);
            z-index: 3000;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            border-left: 2px solid var(--primary-red);
        }

        .cart-sidebar.active {
            right: 0;
        }

        .cart-header {
            padding: 25px;
            border-bottom: 1px solid var(--gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            letter-spacing: 2px;
        }

        .cart-close {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .cart-close:hover {
            color: var(--primary-red);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid var(--gray);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .cart-item-image {
            width: 60px;
            height: 60px;
            background: var(--gray);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-name {
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .cart-item-price {
            color: var(--primary-red);
            font-weight: bold;
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: var(--light-gray);
            cursor: pointer;
            transition: color 0.3s;
        }

        .cart-item-remove:hover {
            color: var(--primary-red);
        }

        .cart-footer {
            padding: 25px;
            border-top: 1px solid var(--gray);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
        }

        .cart-total span:last-child {
            color: var(--primary-red);
        }

        .checkout-btn {
            width: 100%;
            padding: 18px;
            background: var(--primary-red);
            border: none;
            color: white;
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            background: var(--dark-red);
        }

        .cart-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--light-gray);
        }

        .cart-empty svg {
            width: 80px;
            height: 80px;
            fill: var(--gray);
            margin-bottom: 20px;
        }

        /* Overlay for cart */
        .page-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .page-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--primary-red);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
            z-index: 4000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(178, 34, 34, 0.5);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .modal-content {
                grid-template-columns: 1fr;
                max-height: 90vh;
                overflow-y: auto;
            }

            .modal-image {
                padding: 30px;
            }

            .modal-image .product-icon {
                font-size: 100px;
            }

            .cart-sidebar {
                width: 100%;
                right: -100%;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a href="index.html" class="logo">The Real <span>Cut Above</span></a>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="shop.html">STORE</a></li>
                <li><a href="#">ABOUT</a></li>
            </ul>
        </nav>
        <button class="cart-btn" onclick="toggleCart()">
            <svg width="24" height="24" viewBox="0 0 24 24">
                <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
            <span class="cart-count" id="cartCount" style="display: none;">0</span>
        </button>
    </header>

    <!-- Shop Hero -->
    <section class="shop-hero">
        <h1>TRCA PRODUCTS</h1>
        <p>Premium Hair & Face Products by Keith Potter</p>
    </section>

    <!-- Category Tabs -->
    <div class="category-tabs">
        <button class="tab-btn active" data-category="all">ALL PRODUCTS</button>
        <button class="tab-btn" data-category="hair">HAIR CARE</button>
        <button class="tab-btn" data-category="face">FACE CARE</button>
        <button class="tab-btn" data-category="tools">TOOLS</button>
    </div>

    <!-- Products Grid -->
    <section class="products-section">
        <div class="products-grid" id="productsGrid">
            <!-- Products will be injected by JavaScript -->
        </div>
    </section>

    <!-- Product Modal -->
    <div class="modal-overlay" id="productModal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="modal-content">
            <div class="modal-image">
                <span class="product-icon" id="modalIcon">🧴</span>
            </div>
            <div class="modal-details">
                <h2 class="modal-title" id="modalTitle">Product Name</h2>
                <p class="modal-description" id="modalDescription">Product description goes here.</p>
                <ul class="modal-features" id="modalFeatures">
                    <li>Feature 1</li>
                    <li>Feature 2</li>
                </ul>
                <div class="modal-price" id="modalPrice">$24.99</div>
                <div class="quantity-selector">
                    <label>Quantity:</label>
                    <div class="quantity-controls">
                        <button onclick="changeQuantity(-1)">-</button>
                        <input type="number" id="modalQuantity" value="1" min="1" max="10">
                        <button onclick="changeQuantity(1)">+</button>
                    </div>
                </div>
                <button class="modal-add-btn" onclick="addToCartFromModal()">ADD TO CART</button>
            </div>
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div class="page-overlay" id="pageOverlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>YOUR CART</h3>
            <button class="cart-close" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <div class="cart-empty">
                <svg viewBox="0 0 24 24">
                    <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
                <p>Your cart is empty</p>
            </div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn">CHECKOUT</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">Added to cart!</div>

    <script>
        // Product Data
        const products = [
            {
                id: 1,
                name: "TRCA Pomade",
                description: "Premium hold pomade for classic styles",
                price: 24.99,
                originalPrice: 29.99,
                category: "hair",
                icon: "🧴",
                badge: "BESTSELLER",
                features: ["Strong hold all day", "Water-based formula", "Easy to wash out", "Natural shine finish"]
            },
            {
                id: 2,
                name: "Beard Oil",
                description: "Nourishing oil for a healthy beard",
                price: 19.99,
                category: "face",
                icon: "🧔",
                badge: "NEW",
                features: ["100% natural oils", "Reduces itching", "Promotes growth", "Fresh scent"]
            },
            {
                id: 3,
                name: "Wave Cream",
                description: "Get those 360 waves popping",
                price: 18.99,
                category: "hair",
                icon: "🌊",
                badge: null,
                features: ["Deep wave definition", "Moisturizing formula", "Long-lasting hold", "No flaking"]
            },
            {
                id: 4,
                name: "Clippers Pro",
                description: "Professional grade hair clippers",
                price: 149.99,
                originalPrice: 179.99,
                category: "tools",
                icon: "✂️",
                badge: "SALE",
                features: ["Precision blades", "Cordless operation", "4-hour battery", "Multiple guards included"]
            },
            {
                id: 5,
                name: "Shave Gel",
                description: "Smooth shave, no irritation",
                price: 14.99,
                category: "face",
                icon: "🪒",
                badge: null,
                features: ["Sensitive skin formula", "Moisturizing agents", "Clean fresh scent", "No razor burn"]
            },
            {
                id: 6,
                name: "Edge Control",
                description: "Maximum hold for perfect edges",
                price: 12.99,
                category: "hair",
                icon: "💈",
                badge: "POPULAR",
                features: ["24-hour hold", "No white residue", "Humidity resistant", "Adds shine"]
            },
            {
                id: 7,
                name: "Durag Silk",
                description: "Premium silk durag for waves",
                price: 15.99,
                category: "tools",
                icon: "👑",
                badge: null,
                features: ["100% silk material", "Comfortable fit", "Preserves waves", "Multiple colors"]
            },
            {
                id: 8,
                name: "Moisturizer",
                description: "Daily face moisturizer for men",
                price: 22.99,
                category: "face",
                icon: "💧",
                badge: null,
                features: ["SPF 15 protection", "Non-greasy formula", "All skin types", "Vitamin E enriched"]
            }
        ];

        let cart = [];
        let currentProduct = null;

        // Render Products
        function renderProducts(category = 'all') {
            const grid = document.getElementById('productsGrid');
            const filtered = category === 'all' ? products : products.filter(p => p.category === category);

            grid.innerHTML = filtered.map(product => `
                <div class="product-card" onclick="openModal(${product.id})">
                    <div class="product-image">
                        ${product.badge ? `<span class="product-badge">${product.badge}</span>` : ''}
                        <span class="product-icon">${product.icon}</span>
                        <button class="quick-view-btn" onclick="event.stopPropagation(); openModal(${product.id})">QUICK VIEW</button>
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <p class="product-description">${product.description}</p>
                        <div class="product-price">
                            ${product.originalPrice ? `<span class="original">$${product.originalPrice.toFixed(2)}</span>` : ''}
                            $${product.price.toFixed(2)}
                        </div>
                        <button class="add-to-cart-btn" onclick="event.stopPropagation(); addToCart(${product.id}, this)">ADD TO CART</button>
                    </div>
                </div>
            `).join('');
        }

        // Category Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderProducts(btn.dataset.category);
            });
        });

        // Modal Functions
        function openModal(productId) {
            currentProduct = products.find(p => p.id === productId);
            if (!currentProduct) return;

            document.getElementById('modalIcon').textContent = currentProduct.icon;
            document.getElementById('modalTitle').textContent = currentProduct.name;
            document.getElementById('modalDescription').textContent = currentProduct.description;
            document.getElementById('modalPrice').textContent = `$${currentProduct.price.toFixed(2)}`;
            document.getElementById('modalQuantity').value = 1;

            const featuresHtml = currentProduct.features.map(f => `<li>${f}</li>`).join('');
            document.getElementById('modalFeatures').innerHTML = featuresHtml;

            document.getElementById('productModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function changeQuantity(delta) {
            const input = document.getElementById('modalQuantity');
            let value = parseInt(input.value) + delta;
            if (value < 1) value = 1;
            if (value > 10) value = 10;
            input.value = value;
        }

        // Cart Functions
        function addToCart(productId, button) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
            showToast(`${product.name} added to cart!`);

            if (button) {
                button.textContent = 'ADDED!';
                button.classList.add('added');
                setTimeout(() => {
                    button.textContent = 'ADD TO CART';
                    button.classList.remove('added');
                }, 1500);
            }
        }

        function addToCartFromModal() {
            if (!currentProduct) return;
            const quantity = parseInt(document.getElementById('modalQuantity').value);

            const existingItem = cart.find(item => item.id === currentProduct.id);
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                cart.push({ ...currentProduct, quantity });
            }

            updateCartUI();
            showToast(`${currentProduct.name} added to cart!`);
            closeModal();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            if (totalItems > 0) {
                cartCount.style.display = 'flex';
                cartCount.textContent = totalItems;

                cartItems.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-image">${item.icon}</div>
                        <div class="cart-item-details">
                            <div class="cart-item-name">${item.name} x${item.quantity}</div>
                            <div class="cart-item-price">$${(item.price * item.quantity).toFixed(2)}</div>
                        </div>
                        <button class="cart-item-remove" onclick="removeFromCart(${item.id})">✕</button>
                    </div>
                `).join('');
            } else {
                cartCount.style.display = 'none';
                cartItems.innerHTML = `
                    <div class="cart-empty">
                        <svg viewBox="0 0 24 24">
                            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                        </svg>
                        <p>Your cart is empty</p>
                    </div>
                `;
            }

            cartTotal.textContent = `$${totalPrice.toFixed(2)}`;
        }

        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('active');
            document.getElementById('pageOverlay').classList.toggle('active');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                if (document.getElementById('cartSidebar').classList.contains('active')) {
                    toggleCart();
                }
            }
        });

        // Initialize
        renderProducts();
    </script>
</body>
</html>
